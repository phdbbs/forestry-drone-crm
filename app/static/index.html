<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>林业无人机CRM系统</title>
<style>
*{margin:0;padding:0;box-sizing;border-box}
:root{--primary:#15803d;--pl:#22c55e;--pd:#14532d;--sw:220px;--bg:#f0fdf4;--cb:#fff;--tx:#1a1a1a;--tl:#6b7280;--brd:#d1fae5;--dn:#dc2626;--wn:#f59e0b;--ok:#16a34a;--if:#3b82f6}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex}
.sidebar{position:fixed;left:0;top:0;width:var(--sw);height:100vh;background:linear-gradient(180deg,var(--pd),var(--primary));color:#fff;z-index:100;overflow-y:auto;display:flex;flex-direction:column;transition:transform .3s}
.sidebar-logo{padding:20px 16px;font-size:17px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.15);text-align:center;white-space:nowrap}
.sidebar-nav{padding:8px 0;flex:1}
.sidebar-nav a{display:flex;align-items:center;gap:10px;padding:12px 20px;color:rgba(255,255,255,.8);text-decoration:none;font-size:14px;transition:background-color .2s,color .2s,border-left-color .2s;cursor:pointer;border-left:3px solid transparent}
.sidebar-nav a:hover,.sidebar-nav a.active{background:rgba(255,255,255,.15);color:#fff;border-left-color:var(--pl)}
.sidebar-nav a .icon{font-size:16px;width:20px;text-align:center}
.main{margin-left:var(--sw);min-height:100vh;display:flex;flex-direction:column;flex:1}
.header{background:#fff;padding:16px 24px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.header h1{font-size:20px;color:var(--pd)}
.header-actions{display:flex;gap:8px;align-items:center}
.content{flex:1;padding:24px;overflow-y:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--cb);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--brd)}
.stat-num{font-size:28px;font-weight:700;color:var(--primary)}
.stat-label{font-size:13px;color:var(--tl);margin-top:4px}
.card{background:var(--cb);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--brd);margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;color:var(--pd);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;font-size:14px;cursor:pointer;transition:background-color .2s,color .2s,opacity .2s;text-decoration:none;font-family:inherit;background:#e5e7eb;color:var(--tx)}
.btn:hover{opacity:.85}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--pd)}
.btn-success{background:var(--ok);color:#fff}.btn-success:hover{background:#15803d}
.btn-danger{background:var(--dn);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-warning{background:var(--wn);color:#fff}
.btn-info{background:var(--if);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500}
.badge-high{background:#fef3c7;color:#92400e}
.badge-medium{background:#dbeafe;color:#1e40af}
.badge-low{background:#f3f4f6;color:#4b5563}
.badge-active{background:#d1fae5;color:#065f46}
.badge-converted{background:#e0e7ff;color:#3730a3}
.badge-abandoned{background:#fee2e2;color:#991b1b}
.badge-pending{background:#fef3c7;color:#92400e}
.badge-completed{background:#d1fae5;color:#065f46}
.search-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-bar input,.search-bar select{min-width:160px;flex:0 1 auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--brd);font-size:13px}
th{background:#f0fdf4;color:var(--pd);font-weight:600;position:sticky;top:0}
tr:hover{background:#f0fdf4}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--tl)}
.form-row{display:flex;gap:12px;flex-wrap:wrap}.form-row .form-group{flex:1;min-width:180px}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--brd);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,128,61,.1)}
textarea{resize:vertical;min-height:80px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:600px;max-height:85vh;overflow-y:auto;overscroll-behavior:contain;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{margin-bottom:16px;color:var(--pd);font-size:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-row{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #e5e7eb;font-size:14px}
.detail-row .lbl{color:var(--tl);min-width:80px;font-weight:500;flex-shrink:0}
.kanban-board{display:flex;gap:16px;overflow-x:auto;padding-bottom:16px;min-height:400px}
.kanban-col{min-width:280px;background:#f9fafb;border-radius:12px;padding:12px;flex-shrink:0;display:flex;flex-direction:column}
.kanban-col-header{font-weight:600;padding:10px;border-radius:8px;margin-bottom:10px;text-align:center;font-size:14px;background:#e5e7eb}
.kanban-col-body{flex:1;min-height:100px}
.kanban-col-body.drag-over{background:#d1fae5;border-radius:8px}
.kanban-card{background:#fff;border-radius:8px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:grab;transition:transform .1s,box-shadow .2s;border-left:4px solid #d1d5db}
.kanban-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.kanban-card.dragging{opacity:.5;transform:rotate(2deg)}
.kanban-card-red{border-left-color:var(--dn)}
.kanban-card-yellow{border-left-color:var(--wn)}
.kanban-card-green{border-left-color:var(--ok)}
.kanban-card-blue{border-left-color:var(--if)}
.kanban-card .card-title{font-weight:600;font-size:14px;margin-bottom:4px}
.kanban-card .card-desc{font-size:12px;color:var(--tl);margin-bottom:6px}
.kanban-card .card-deadline{font-size:11px;color:var(--dn);margin-bottom:6px}
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--brd)}
.timeline-item{position:relative;padding-bottom:16px}
.timeline-item::before{content:'';position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary)}
.timeline-item .tl-stage{font-weight:600;color:var(--pd)}
.timeline-item .tl-content{font-size:13px;color:var(--tl);margin-top:4px}
.timeline-item .tl-deadline{font-size:12px;color:var(--dn);margin-top:2px}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-size:14px;z-index:300;animation:slideIn .3s ease;max-width:300px}
.toast-success{background:var(--ok)}
.toast-error{background:var(--dn)}
.toast-info{background:var(--if)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.empty-state{text-align:center;padding:40px;color:var(--tl);font-size:14px}
.section-title{font-size:16px;font-weight:600;color:var(--pd);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.settings-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f3f4f6}
.settings-label{min-width:100px;font-size:14px;font-weight:500;color:var(--tl)}
.skill-badge{display:inline-block;padding:6px 14px;background:#f0fdf4;border:1px solid var(--brd);border-radius:20px;font-size:13px;margin:4px;cursor:pointer;transition:background-color .2s,color .2s}
.skill-badge:hover{background:var(--primary);color:#fff}
.mobile-toggle{display:none;position:fixed;bottom:16px;right:16px;z-index:150;width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.searchable-select{position:relative;display:block}
.ss-display{width:100%;padding:8px 12px;border:1px solid var(--brd);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;cursor:pointer;min-height:36px;display:flex;align-items:center;justify-content:space-between;color:var(--tx)}
.ss-display.placeholder{color:var(--tl)}
.ss-display::after{content:'▾';font-size:12px;color:var(--tl);margin-left:8px}
.ss-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--brd);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:300;padding:6px;display:flex;flex-direction:column}
.ss-filter{margin-bottom:6px}
.ss-list{max-height:240px;overflow-y:auto;border-radius:6px}
.ss-item{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--tx);transition:background-color .15s,color .15s}
.ss-item:hover,.ss-item.active{background:var(--primary);color:#fff}
.ss-item .ss-sub{font-size:12px;color:var(--tl);margin-top:2px}
.ss-item:hover .ss-sub,.ss-item.active .ss-sub{color:rgba(255,255,255,.85)}
.ss-empty{padding:12px;color:var(--tl);font-size:13px;text-align:center}
.num{font-variant-numeric:tabular-nums}
.pagination{display:flex;gap:6px;align-items:center;justify-content:center;padding:12px 0;flex-wrap:wrap}
.pagination button{min-width:32px}
.pagination .pg-info{font-size:13px;color:var(--tl);margin:0 8px}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}
  .mobile-toggle{display:flex;align-items:center;justify-content:center}
  .header{padding:12px 16px}
  .content{padding:16px}
  table{font-size:12px}
  th,td{padding:8px 6px}
}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="sidebar-logo">🚁 林业无人机CRM</div>
  <nav class="sidebar-nav">
    <a href="#dashboard" class="active" data-page="dashboard"><span class="icon">📊</span> 仪表盘</a>
    <a href="#leads" data-page="leads"><span class="icon">📋</span> 线索管理</a>
    <a href="#opportunities" data-page="opportunities"><span class="icon">💼</span> 商机管理</a>
    <a href="#contacts" data-page="contacts"><span class="icon">👤</span> 联系人</a>
    <a href="#customers" data-page="customers"><span class="icon">🏢</span> 客户管理</a>
    <a href="#kanban" data-page="kanban"><span class="icon">📌</span> 看板</a>
    <a href="#activities" data-page="activities"><span class="icon">📝</span> 活动记录</a>
    <a href="#followups" data-page="followups"><span class="icon">🔔</span> 跟进提醒</a>
    <a href="#settings" data-page="settings"><span class="icon">⚙️</span> 系统设置</a>
  </nav>
</div>

<div class="main">
  <div class="header">
    <h1 id="pageTitle">仪表盘</h1>
    <div class="header-actions">
      <span id="headerInfo" style="font-size:13px;color:var(--tl)"></span>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<button class="mobile-toggle" id="mobileToggle" onclick="toggleSidebar()" aria-label="打开菜单">☰</button>

<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="if(event.target===this)closeModal()"></div>

<script>
const API = '/api';

// ===== UTILITIES =====
async function api(path, opts = {}) {
  const url = API + path;
  const def = { headers: { 'Content-Type': 'application/json' } };
  const res = await fetch(url, { ...def, ...opts });
  const text = await res.text();
  if (!text) return null;
  try { return JSON.parse(text); } catch { return text; }
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  t.setAttribute('role', 'status');
  t.setAttribute('aria-live', 'polite');
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
}

function fmtDate(d) {
  if (!d) return '-';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('zh-CN');
}

function fmtDateTime(d) {
  if (!d) return '-';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleString('zh-CN');
}

function dateInput(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return '';
  return dt.toISOString().slice(0, 10);
}

function datetimeInput(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return '';
  return dt.toISOString().slice(0, 16);
}

// ===== MODAL =====
let _lastFocused = null;
function openModal(html) {
  _lastFocused = document.activeElement;
  const overlay = document.getElementById('modalOverlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
  // Focus first interactive element
  setTimeout(() => {
    const modal = overlay.querySelector('.modal');
    if (!modal) return;
    const focusable = modal.querySelector('input:not([type="hidden"]), select, textarea, button, a[href], [tabindex]:not([tabindex="-1"])');
    if (focusable) { try { focusable.focus(); } catch (e) {} }
    else { modal.setAttribute('tabindex', '-1'); modal.focus(); }
  }, 0);
}

function closeModal() {
  const overlay = document.getElementById('modalOverlay');
  overlay.style.display = 'none';
  overlay.innerHTML = '';
  if (_lastFocused && typeof _lastFocused.focus === 'function') {
    try { _lastFocused.focus(); } catch (e) {}
  }
  _lastFocused = null;
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && document.getElementById('modalOverlay').style.display !== 'none') {
    closeModal();
  }
});

// ===== SEARCHABLE SELECT =====
function searchableSelect(containerId, currentId, items, opts) {
  opts = opts || {};
  const container = document.getElementById(containerId);
  if (!container) return { getValue: () => currentId || null };
  items = Array.isArray(items) ? items : [];
  let selectedId = currentId != null ? currentId : null;
  let filtered = items.slice();
  let activeIndex = -1;
  const placeholder = opts.placeholder || '请选择…';

  container.classList.add('searchable-select');
  container.innerHTML = `
    <div class="ss-display placeholder" tabindex="0" role="combobox" aria-haspopup="listbox" aria-expanded="false"></div>
    <div class="ss-panel" style="display:none" role="listbox">
      <input class="ss-filter" type="text" placeholder="搜索…" aria-label="搜索过滤">
      <div class="ss-list"></div>
    </div>
  `;
  const display = container.querySelector('.ss-display');
  const panel = container.querySelector('.ss-panel');
  const filterInput = container.querySelector('.ss-filter');
  const listEl = container.querySelector('.ss-list');

  function renderDisplay() {
    const sel = items.find(i => i.id === selectedId);
    if (sel) {
      display.textContent = sel.name;
      display.classList.remove('placeholder');
    } else {
      display.textContent = placeholder;
      display.classList.add('placeholder');
    }
  }

  function renderList() {
    if (!filtered.length) {
      listEl.innerHTML = '<div class="ss-empty">暂无数据</div>';
      return;
    }
    listEl.innerHTML = filtered.map((it, idx) => `
      <div class="ss-item${idx === activeIndex ? ' active' : ''}" data-id="${esc(String(it.id))}" role="option" aria-selected="${it.id === selectedId ? 'true' : 'false'}">
        <div>${esc(it.name || '')}</div>
        ${it.sub ? `<div class="ss-sub">${esc(it.sub)}</div>` : ''}
      </div>
    `).join('');
  }

  function openPanel() {
    panel.style.display = 'flex';
    display.setAttribute('aria-expanded', 'true');
    filterInput.value = '';
    filtered = items.slice();
    activeIndex = filtered.findIndex(i => i.id === selectedId);
    renderList();
    setTimeout(() => filterInput.focus(), 0);
  }

  function closePanel() {
    panel.style.display = 'none';
    display.setAttribute('aria-expanded', 'false');
    activeIndex = -1;
  }

  function isOpen() { return panel.style.display === 'flex'; }

  function doFilter() {
    const q = (filterInput.value || '').toLowerCase();
    filtered = items.filter(it => {
      const name = (it.name || '').toLowerCase();
      const sub = (it.sub || '').toLowerCase();
      return !q || name.indexOf(q) >= 0 || sub.indexOf(q) >= 0;
    });
    activeIndex = filtered.length ? 0 : -1;
    renderList();
  }

  function pick(id) {
    selectedId = id != null ? (typeof id === 'string' && items.length && typeof items[0].id === 'number' ? Number(id) : id) : null;
    // normalize id type against items
    const found = items.find(i => String(i.id) === String(id));
    selectedId = found ? found.id : null;
    renderDisplay();
    closePanel();
    if (typeof opts.onChange === 'function') opts.onChange(selectedId);
  }

  display.addEventListener('click', function (e) {
    e.stopPropagation();
    if (isOpen()) closePanel(); else openPanel();
  });
  display.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') {
      e.preventDefault();
      openPanel();
    }
  });
  filterInput.addEventListener('input', doFilter);
  filterInput.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (filtered.length) { activeIndex = Math.min(activeIndex + 1, filtered.length - 1); renderList(); }
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (filtered.length) { activeIndex = Math.max(activeIndex - 1, 0); renderList(); }
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIndex >= 0 && activeIndex < filtered.length) pick(filtered[activeIndex].id);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      closePanel();
      display.focus();
    }
  });
  listEl.addEventListener('click', function (e) {
    const item = e.target.closest('.ss-item');
    if (item) pick(item.dataset.id);
  });
  document.addEventListener('click', function (e) {
    if (!container.contains(e.target)) closePanel();
  });

  renderDisplay();
  return {
    getValue: () => selectedId,
    setValue: (id) => { selectedId = id != null ? (items.find(i => String(i.id) === String(id)) || {}).id || id : null; renderDisplay(); },
    refresh: (newItems, newId) => {
      items = Array.isArray(newItems) ? newItems : [];
      if (newId !== undefined) selectedId = newId;
      else {
        const stillExists = items.find(i => String(i.id) === String(selectedId));
        selectedId = stillExists ? stillExists.id : null;
      }
      renderDisplay();
    }
  };
}

// ===== CONFIRM / PROMPT DIALOGS =====
function confirmDialog(title, message, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    const confirmText = opts.confirmText || '确认';
    const danger = opts.danger ? 'btn-danger' : 'btn-primary';
    openModal(`
      <h3>${esc(title)}</h3>
      <div style="font-size:14px;line-height:1.6;color:var(--tx);margin-bottom:8px">${esc(message)}</div>
      <div class="modal-actions">
        <button class="btn" data-act="cancel">取消</button>
        <button class="btn ${danger}" data-act="ok">${esc(confirmText)}</button>
      </div>
    `);
    const overlay = document.getElementById('modalOverlay');
    overlay.querySelector('[data-act="cancel"]').onclick = () => { closeModal(); resolve(false); };
    overlay.querySelector('[data-act="ok"]').onclick = () => { closeModal(); resolve(true); };
  });
}

function promptDialog(title, message, defaultValue) {
  return new Promise(resolve => {
    openModal(`
      <h3>${esc(title)}</h3>
      <div style="font-size:14px;color:var(--tl);margin-bottom:8px">${esc(message || '')}</div>
      <div class="form-group"><input id="dlg_prompt_input" value="${esc(defaultValue || '')}"></div>
      <div class="modal-actions">
        <button class="btn" data-act="cancel">取消</button>
        <button class="btn btn-primary" data-act="ok">确认</button>
      </div>
    `);
    const overlay = document.getElementById('modalOverlay');
    const input = overlay.querySelector('#dlg_prompt_input');
    overlay.querySelector('[data-act="cancel"]').onclick = () => { closeModal(); resolve(null); };
    overlay.querySelector('[data-act="ok"]').onclick = () => { const v = input.value; closeModal(); resolve(v); };
    if (input) {
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { const v = input.value; closeModal(); resolve(v); }
      });
    }
  });
}

// ===== URL HASH QUERY HELPERS =====
function parseHashQuery() {
  const raw = window.location.hash.slice(1) || '';
  const [page, qs] = raw.split('?');
  const params = {};
  if (qs) {
    qs.split('&').forEach(pair => {
      const [k, v] = pair.split('=');
      if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
    });
  }
  return { page: page || 'dashboard', params };
}

function updateHashQuery(page, params) {
  const parts = [page];
  const kv = [];
  Object.keys(params || {}).forEach(k => {
    const v = params[k];
    if (v !== undefined && v !== null && v !== '') kv.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
  });
  let hash = page;
  if (kv.length) hash += '?' + kv.join('&');
  if (window.location.hash !== '#' + hash) {
    window.location.hash = hash;
  }
}

// ===== CUSTOMER/CONTACT CASCADE HELPER =====
async function setupCustomerContactCascade(custContainerId, contactContainerId, currentCustId, currentContactId, opts) {
  opts = opts || {};
  const custResp = await api('/customers?page=1&page_size=500');
  const customers = Array.isArray(custResp) ? custResp : (custResp?.data || []);
  const custItems = customers.map(cu => ({ id: cu.id, name: cu.name, sub: cu.short_name || '' }));
  const holder = { customerSelect: null, contactSelect: null };

  async function refreshContacts(custId, selId) {
    if (!custId) {
      holder.contactSelect = searchableSelect(contactContainerId, null, [], { placeholder: '无' });
      return;
    }
    try {
      const r = await api('/contacts?customer_id=' + custId);
      const list = Array.isArray(r) ? r : (r?.data || []);
      const items = list.map(ct => ({ id: ct.id, name: ct.name, sub: ct.phone || '' }));
      holder.contactSelect = searchableSelect(contactContainerId, selId || null, items, { placeholder: '无' });
    } catch (e) {
      holder.contactSelect = searchableSelect(contactContainerId, null, [], { placeholder: '无' });
    }
  }

  holder.customerSelect = searchableSelect(custContainerId, currentCustId || null, custItems, {
    placeholder: '无',
    onChange: async (newCustId) => {
      await refreshContacts(newCustId, null);
      if (typeof opts.onCustomerChange === 'function') {
        try { opts.onCustomerChange(newCustId); } catch (e) {}
      }
    }
  });
  await refreshContacts(currentCustId || null, currentContactId || null);
  return holder;
}

function renderLeadPagination(page, total) {
  const el = document.getElementById('lPagination');
  if (!el) return;
  const pageSize = window._leadsPageSize || 20;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (totalPages <= 1) { el.innerHTML = `<span class="pg-info">共 ${total} 条</span>`; return; }
  let html = `<button class="btn btn-sm" ${page <= 1 ? 'disabled' : ''} onclick="loadLeads(${page - 1})">上一页</button>`;
  const maxBtns = 7;
  let start = Math.max(1, page - 3);
  let end = Math.min(totalPages, start + maxBtns - 1);
  start = Math.max(1, end - maxBtns + 1);
  if (start > 1) html += `<button class="btn btn-sm" onclick="loadLeads(1)">1</button>`;
  if (start > 2) html += '<span class="pg-info">…</span>';
  for (let i = start; i <= end; i++) {
    html += `<button class="btn btn-sm ${i === page ? 'btn-primary' : ''}" onclick="loadLeads(${i})">${i}</button>`;
  }
  if (end < totalPages - 1) html += '<span class="pg-info">…</span>';
  if (end < totalPages) html += `<button class="btn btn-sm" onclick="loadLeads(${totalPages})">${totalPages}</button>`;
  html += `<button class="btn btn-sm" ${page >= totalPages ? 'disabled' : ''} onclick="loadLeads(${page + 1})">下一页</button>`;
  html += `<span class="pg-info">第 ${page}/${totalPages} 页 · 共 ${total} 条</span>`;
  el.innerHTML = html;
}

async function loadLeads(page) {
  page = page || 1;
  const q = (document.getElementById('lSearch')?.value || '').trim();
  const st = document.getElementById('lStatus')?.value || '';
  const lv = document.getElementById('lLevel')?.value || '';
  window._leadsPage = page;
  updateHashQuery('leads', { search: q, status: st, level: lv, page });
  let url = '/leads?page=' + page + '&page_size=' + (window._leadsPageSize || 20);
  if (q) url += '&search=' + encodeURIComponent(q);
  if (st) url += '&status=' + st;
  if (lv) url += '&level=' + encodeURIComponent(lv);
  const d = await api(url);
  const list = Array.isArray(d) ? d : (d.data || []);
  const total = (d && d.total != null) ? d.total : list.length;
  window._leadsList = list;
  window._leadsTotal = total;
  renderLeadTable(list);
  renderLeadPagination(page, total);
}

async function loadOpportunities(page) {
  page = page || 1;
  const search = (document.getElementById('oSearch')?.value || '').trim();
  window._oppPage = page;
  updateHashQuery('opportunities', { search, page });
  let url = '/opportunities?page=' + page + '&page_size=' + (window._oppPageSize || 20);
  if (search) url += '&search=' + encodeURIComponent(search);
  const d = await api(url);
  const list = Array.isArray(d) ? d : (d.data || []);
  const total = (d && d.total != null) ? d.total : list.length;
  window._oppList = list;
  window._oppTotal = total;
  renderOppTable(list);

function renderOppPagination(page, total) {
  const el = document.getElementById('oPagination');
  if (!el) return;
  const pageSize = window._oppPageSize || 20;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (totalPages <= 1) { el.innerHTML = `<span class="pg-info">共 ${total} 条</span>`; return; }
  let html = `<button class="btn btn-sm" ${page <= 1 ? 'disabled' : ''} onclick="loadOpportunities(${page - 1})">上一页</button>`;
  const maxBtns = 7;
  let start = Math.max(1, page - 3);
  let end = Math.min(totalPages, start + maxBtns - 1);
  start = Math.max(1, end - maxBtns + 1);
  if (start > 1) html += `<button class="btn btn-sm" onclick="loadOpportunities(1)">1</button>`;
  if (start > 2) html += '<span class="pg-info">…</span>';
  for (let i = start; i <= end; i++) {
    html += `<button class="btn btn-sm ${i === page ? 'btn-primary' : ''}" onclick="loadOpportunities(${i})">${i}</button>`;
  }
  if (end < totalPages - 1) html += '<span class="pg-info">…</span>';
  if (end < totalPages) html += `<button class="btn btn-sm" onclick="loadOpportunities(${totalPages})">${totalPages}</button>`;
  html += `<button class="btn btn-sm" ${page >= totalPages ? 'disabled' : ''} onclick="loadOpportunities(${page + 1})">下一页</button>`;
  html += `<span class="pg-info">第 ${page}/${totalPages} 页 · 共 ${total} 条</span>`;
  el.innerHTML = html;
}

}

        ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
        ${(col.cards || []).map(card => `
          <div class="kanban-card kanban-card-${card.color || 'blue'}" draggable="true"
            data-card-id="${card.id}" ondragstart="handleDragStart(event)" ondragend="handleDragEnd(event)">
            <div class="card-title">${esc(card.title)}</div>
            ${card.description ? `<div class="card-desc">${esc(card.description)}</div>` : ''}

let _dragCardId = null;

function handleDragStart(e) {
  _dragCardId = parseInt(e.target.dataset.cardId);
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', _dragCardId);
}

function handleDragEnd(e) {
  e.target.classList.remove('dragging');
  _dragCardId = null;
}

function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const body = e.target.closest('.kanban-col-body');
  if (body) body.classList.add('drag-over');
}

function handleDragLeave(e) {
  const body = e.target.closest('.kanban-col-body');
  if (body) body.classList.remove('drag-over');
}

async function handleDrop(e) {
  e.preventDefault();
  const body = e.target.closest('.kanban-col-body');
  if (!body || !_dragCardId) return;
  body.classList.remove('drag-over');
  const colId = parseInt(body.dataset.colId);
  await api('/kanban/cards/' + _dragCardId + '/move', { method: 'POST', body: JSON.stringify({ column_id: colId }) });
  toast('移动成功', 'success');
  render('kanban');
}

let _actSearchTimer = null;
function actSearchDebounce() {
  clearTimeout(_actSearchTimer);
  _actSearchTimer = setTimeout(() => loadActivities(1), 350);
}

async function loadActivities(page) {
  page = page || 1;
  const search = (document.getElementById('aSearch')?.value || '').trim();
  const method = document.getElementById('aMethod')?.value || '';
  window._actPage = page;
  updateHashQuery('activities', { search, method, page });
  let url = '/activities?page=' + page + '&page_size=' + (window._actPageSize || 20);
  if (search) url += '&search=' + encodeURIComponent(search);
  if (method) url += '&method=' + encodeURIComponent(method);
  const d = await api(url);
  const list = Array.isArray(d) ? d : (d.data || []);
  const total = (d && d.total != null) ? d.total : list.length;
  window._actList = list;
  window._actTotal = total;
  renderActivityTable(list);
  renderActivityPagination(page, total);
}

function renderActivityPagination(page, total) {
  const el = document.getElementById('aPagination');
  if (!el) return;
  const pageSize = window._actPageSize || 20;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (totalPages <= 1) { el.innerHTML = `<span class="pg-info">共 ${total} 条</span>`; return; }
  let html = `<button class="btn btn-sm" ${page <= 1 ? 'disabled' : ''} onclick="loadActivities(${page - 1})">上一页</button>`;
  const maxBtns = 7;
  let start = Math.max(1, page - 3);
  let end = Math.min(totalPages, start + maxBtns - 1);
  start = Math.max(1, end - maxBtns + 1);
  if (start > 1) html += `<button class="btn btn-sm" onclick="loadActivities(1)">1</button>`;
  if (start > 2) html += '<span class="pg-info">…</span>';
  for (let i = start; i <= end; i++) {
    html += `<button class="btn btn-sm ${i === page ? 'btn-primary' : ''}" onclick="loadActivities(${i})">${i}</button>`;
  }
  if (end < totalPages - 1) html += '<span class="pg-info">…</span>';
  if (end < totalPages) html += `<button class="btn btn-sm" onclick="loadActivities(${totalPages})">${totalPages}</button>`;
  html += `<button class="btn btn-sm" ${page >= totalPages ? 'disabled' : ''} onclick="loadActivities(${page + 1})">下一页</button>`;
  html += `<span class="pg-info">第 ${page}/${totalPages} 页 · 共 ${total} 条</span>`;
  el.innerHTML = html;
}

function renderActivityTable(list) {
  const tbody = document.getElementById('aTableBody');
  if (!tbody) return;
  if (!list.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty-state">暂无活动记录</td></tr>'; return; }
  tbody.innerHTML = list.map(a => `
    <tr>

      <td>${a.activity_time ? fmtDateTime(a.activity_time) : '-'}</td>

let _fuSearchTimer = null;
function fuSearchDebounce() {
  clearTimeout(_fuSearchTimer);
  _fuSearchTimer = setTimeout(() => loadFollowups(1), 350);
}

async function loadFollowups(page) {
  page = page || 1;
  const search = (document.getElementById('fSearch')?.value || '').trim();
  window._fuPage = page;
  updateHashQuery('followups', { search, page });
  let url = '/followups?page=' + page + '&page_size=' + (window._fuPageSize || 20);
  if (search) url += '&search=' + encodeURIComponent(search);
  const d = await api(url);
  const list = Array.isArray(d) ? d : (d.data || []);
  const total = (d && d.total != null) ? d.total : list.length;
  window._fuList = list;
  window._fuTotal = total;
  renderFollowupTable(list);
  renderFollowupPagination(page, total);
}

function renderFollowupPagination(page, total) {
  const el = document.getElementById('fPagination');
  if (!el) return;
  const pageSize = window._fuPageSize || 20;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (totalPages <= 1) { el.innerHTML = `<span class="pg-info">共 ${total} 条</span>`; return; }
  let html = `<button class="btn btn-sm" ${page <= 1 ? 'disabled' : ''} onclick="loadFollowups(${page - 1})">上一页</button>`;
  const maxBtns = 7;
  let start = Math.max(1, page - 3);
  let end = Math.min(totalPages, start + maxBtns - 1);
  start = Math.max(1, end - maxBtns + 1);
  if (start > 1) html += `<button class="btn btn-sm" onclick="loadFollowups(1)">1</button>`;
  if (start > 2) html += '<span class="pg-info">…</span>';
  for (let i = start; i <= end; i++) {
    html += `<button class="btn btn-sm ${i === page ? 'btn-primary' : ''}" onclick="loadFollowups(${i})">${i}</button>`;
  }
  if (end < totalPages - 1) html += '<span class="pg-info">…</span>';
  if (end < totalPages) html += `<button class="btn btn-sm" onclick="loadFollowups(${totalPages})">${totalPages}</button>`;
  html += `<button class="btn btn-sm" ${page >= totalPages ? 'disabled' : ''} onclick="loadFollowups(${page + 1})">下一页</button>`;
  html += `<span class="pg-info">第 ${page}/${totalPages} 页 · 共 ${total} 条</span>`;
  el.innerHTML = html;
}

  const known = DICT_CATEGORIES.map(c => c.key);
  const extra = Object.keys(grouped).filter(k => known.indexOf(k) < 0);
  const allKeys = known.concat(extra);
  sel.innerHTML = allKeys.map(k => {
    const label = (DICT_CATEGORIES.find(c => c.key === k) || {}).label || k;
    return `<option value="${esc(k)}">${esc(label)}</option>`;

  const grouped = window._dictGrouped || {};

  if (!items.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state">暂无选项</td></tr>'; return; }

    <tr>

    </tr>
  `).join('');
}

  return null;

  const label = document.getElementById('d_label').value.trim();
  if (!label) return toast('请填写标签', 'error');
  let key = document.getElementById('d_key').value.trim();
  if (!key) key = label;
  const sort_order = parseInt(document.getElementById('d_sort').value) || 0;
  if (id) {
    await api('/dictionary/' + id, { method: 'PUT', body: JSON.stringify({ label, item_key: key, sort_order }) });
  } else {
    await api('/dictionary', { method: 'POST', body: JSON.stringify({ category: cat, item_key: key, label, sort_order, is_active: true }) });
  }
  toast(id ? '更新成功' : '创建成功', 'success');
  closeModal();
  await refreshDictSettings();
}

async function toggleDictItem(id, active) {
  await api('/dictionary/' + id, { method: 'PUT', body: JSON.stringify({ is_active: !!active }) });
  toast(active ? '已启用' : '已停用', 'success');
  await refreshDictSettings();
}

async function deleteDictItem(id) {
  const ok = await confirmDialog('删除字典选项', '确认删除此字典选项？此操作不可恢复。', { danger: true, confirmText: '删除' });
  if (!ok) return;
  await api('/dictionary/' + id, { method: 'DELETE' });
  toast('已删除', 'success');
  await refreshDictSettings();
}

async function refreshDictSettings() {
  const grouped = await api('/dictionary');
  window._dictGrouped = (grouped && typeof grouped === 'object' && !Array.isArray(grouped)) ? grouped : {};
  renderDictItems();
}

// ===== STAGE MANAGEMENT =====
function renderStageSettings() {
  const tbody = document.getElementById('stage_body');
  if (!tbody) return;
  const stages = (window._stagesList || []).slice().sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  window._stagesList = stages;
  if (!stages.length) { tbody.innerHTML = '<tr><td colspan="3" class="empty-state">暂无阶段</td></tr>'; return; }
  tbody.innerHTML = stages.map((s, idx) => `
    <tr>
      <td>${esc(s.name || '-')}</td>
      <td class="num">${esc(s.sort_order != null ? s.sort_order : idx)}</td>
      <td><div class="btn-group">
        <button class="btn btn-sm" ${idx === 0 ? 'disabled' : ''} onclick="moveStage(${s.id}, -1)">上移</button>
        <button class="btn btn-sm" ${idx === stages.length - 1 ? 'disabled' : ''} onclick="moveStage(${s.id}, 1)">下移</button>
        <button class="btn btn-sm btn-danger" onclick="deleteStageItem(${s.id})">删除</button>
      </div></td>
    </tr>
  `).join('');
}

function showStageForm() {
  openModal(`
    <h3>新增阶段</h3>
    <div class="form-group"><label>阶段名称 *</label><input id="st_name" name="stage_name" autocomplete="off"></div>
    <div class="form-group"><label>排序</label><input id="st_sort" type="number" inputmode="numeric" value="${(window._stagesList || []).length}"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveStageItem()">创建</button>
    </div>
  `);
}

async function saveStageItem() {
  const name = document.getElementById('st_name').value.trim();
  if (!name) return toast('请填写阶段名称', 'error');
  const sort_order = parseInt(document.getElementById('st_sort').value) || 0;
  await api('/stages', { method: 'POST', body: JSON.stringify({ name, sort_order }) });
  toast('创建成功', 'success');
  closeModal();
  await refreshStageSettings();
}

async function moveStage(id, direction) {
  const stages = (window._stagesList || []).slice().sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  const idx = stages.findIndex(s => s.id === id);
  if (idx < 0) return;
  const target = idx + direction;
  if (target < 0 || target >= stages.length) return;
  const a = stages[idx], b = stages[target];
  await Promise.all([
    api('/stages/' + a.id, { method: 'PUT', body: JSON.stringify({ sort_order: b.sort_order }) }),
    api('/stages/' + b.id, { method: 'PUT', body: JSON.stringify({ sort_order: a.sort_order }) }),
  ]);
  toast('排序已更新', 'success');
  await refreshStageSettings();
}

async function deleteStageItem(id) {
  const ok = await confirmDialog('删除阶段', '确认删除此商机阶段？此操作不可恢复。', { danger: true, confirmText: '删除' });
  if (!ok) return;
  await api('/stages/' + id, { method: 'DELETE' });
  toast('已删除', 'success');
  await refreshStageSettings();
}

async function refreshStageSettings() {
  const list = await api('/stages');
  window._stagesList = Array.isArray(list) ? list : [];
  renderStageSettings();
}

// ===== INIT =====
const initialPage = window.location.hash.slice(1) || 'dashboard';
onHashChange();
</script>
</body>
