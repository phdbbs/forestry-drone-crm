<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>林业无人机CRM系统</title>
<style>
*{margin:0;padding:0;box-sizing;border-box}
:root{--primary:#15803d;--pl:#22c55e;--pd:#14532d;--sw:220px;--bg:#f0fdf4;--cb:#fff;--tx:#1a1a1a;--tl:#6b7280;--brd:#d1fae5;--dn:#dc2626;--wn:#f59e0b;--ok:#16a34a;--if:#3b82f6}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex}
.sidebar{position:fixed;left:0;top:0;width:var(--sw);height:100vh;background:linear-gradient(180deg,var(--pd),var(--primary));color:#fff;z-index:100;overflow-y:auto;display:flex;flex-direction:column;transition:transform .3s}
.sidebar-logo{padding:20px 16px;font-size:17px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.15);text-align:center;white-space:nowrap}
.sidebar-nav{padding:8px 0;flex:1}
.sidebar-nav a{display:flex;align-items:center;gap:10px;padding:12px 20px;color:rgba(255,255,255,.8);text-decoration:none;font-size:14px;transition:all .2s;cursor:pointer;border-left:3px solid transparent}
.sidebar-nav a:hover,.sidebar-nav a.active{background:rgba(255,255,255,.15);color:#fff;border-left-color:var(--pl)}
.sidebar-nav a .icon{font-size:16px;width:20px;text-align:center}
.main{margin-left:var(--sw);min-height:100vh;display:flex;flex-direction:column;flex:1}
.header{background:#fff;padding:16px 24px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.header h1{font-size:20px;color:var(--pd)}
.header-actions{display:flex;gap:8px;align-items:center}
.content{flex:1;padding:24px;overflow-y:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--cb);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--brd)}
.stat-num{font-size:28px;font-weight:700;color:var(--primary)}
.stat-label{font-size:13px;color:var(--tl);margin-top:4px}
.card{background:var(--cb);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--brd);margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;color:var(--pd);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;font-size:14px;cursor:pointer;transition:all .2s;text-decoration:none;font-family:inherit;background:#e5e7eb;color:var(--tx)}
.btn:hover{opacity:.85}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--pd)}
.btn-success{background:var(--ok);color:#fff}.btn-success:hover{background:#15803d}
.btn-danger{background:var(--dn);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-warning{background:var(--wn);color:#fff}
.btn-info{background:var(--if);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500}
.badge-high{background:#fef3c7;color:#92400e}
.badge-medium{background:#dbeafe;color:#1e40af}
.badge-low{background:#f3f4f6;color:#4b5563}
.badge-active{background:#d1fae5;color:#065f46}
.badge-converted{background:#e0e7ff;color:#3730a3}
.badge-abandoned{background:#fee2e2;color:#991b1b}
.badge-pending{background:#fef3c7;color:#92400e}
.badge-completed{background:#d1fae5;color:#065f46}
.search-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-bar input,.search-bar select{min-width:160px;flex:0 1 auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--brd);font-size:13px}
th{background:#f0fdf4;color:var(--pd);font-weight:600;position:sticky;top:0}
tr:hover{background:#f0fdf4}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--tl)}
.form-row{display:flex;gap:12px;flex-wrap:wrap}.form-row .form-group{flex:1;min-width:180px}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--brd);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,128,61,.1)}
textarea{resize:vertical;min-height:80px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:600px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{margin-bottom:16px;color:var(--pd);font-size:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-row{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #e5e7eb;font-size:14px}
.detail-row .lbl{color:var(--tl);min-width:80px;font-weight:500;flex-shrink:0}
.kanban-board{display:flex;gap:16px;overflow-x:auto;padding-bottom:16px;min-height:400px}
.kanban-col{min-width:280px;background:#f9fafb;border-radius:12px;padding:12px;flex-shrink:0;display:flex;flex-direction:column}
.kanban-col-header{font-weight:600;padding:10px;border-radius:8px;margin-bottom:10px;text-align:center;font-size:14px;background:#e5e7eb}
.kanban-col-body{flex:1;min-height:100px}
.kanban-col-body.drag-over{background:#d1fae5;border-radius:8px}
.kanban-card{background:#fff;border-radius:8px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:grab;transition:transform .1s,box-shadow .2s;border-left:4px solid #d1d5db}
.kanban-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.kanban-card.dragging{opacity:.5;transform:rotate(2deg)}
.kanban-card-red{border-left-color:var(--dn)}
.kanban-card-yellow{border-left-color:var(--wn)}
.kanban-card-green{border-left-color:var(--ok)}
.kanban-card-blue{border-left-color:var(--if)}
.kanban-card .card-title{font-weight:600;font-size:14px;margin-bottom:4px}
.kanban-card .card-desc{font-size:12px;color:var(--tl);margin-bottom:6px}
.kanban-card .card-deadline{font-size:11px;color:var(--dn);margin-bottom:6px}
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--brd)}
.timeline-item{position:relative;padding-bottom:16px}
.timeline-item::before{content:'';position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary)}
.timeline-item .tl-stage{font-weight:600;color:var(--pd)}
.timeline-item .tl-content{font-size:13px;color:var(--tl);margin-top:4px}
.timeline-item .tl-deadline{font-size:12px;color:var(--dn);margin-top:2px}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-size:14px;z-index:300;animation:slideIn .3s ease;max-width:300px}
.toast-success{background:var(--ok)}
.toast-error{background:var(--dn)}
.toast-info{background:var(--if)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.empty-state{text-align:center;padding:40px;color:var(--tl);font-size:14px}
.section-title{font-size:16px;font-weight:600;color:var(--pd);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.settings-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f3f4f6}
.settings-label{min-width:100px;font-size:14px;font-weight:500;color:var(--tl)}
.skill-badge{display:inline-block;padding:6px 14px;background:#f0fdf4;border:1px solid var(--brd);border-radius:20px;font-size:13px;margin:4px;cursor:pointer;transition:all .2s}
.skill-badge:hover{background:var(--primary);color:#fff}
.mobile-toggle{display:none;position:fixed;bottom:16px;right:16px;z-index:150;width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2)}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}
  .mobile-toggle{display:flex;align-items:center;justify-content:center}
  .header{padding:12px 16px}
  .content{padding:16px}
  table{font-size:12px}
  th,td{padding:8px 6px}
}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="sidebar-logo">🚁 林业无人机CRM</div>
  <nav class="sidebar-nav">
    <a href="#dashboard" class="active" data-page="dashboard"><span class="icon">📊</span> 仪表盘</a>
    <a href="#leads" data-page="leads"><span class="icon">📋</span> 线索管理</a>
    <a href="#opportunities" data-page="opportunities"><span class="icon">💼</span> 商机管理</a>
    <a href="#contacts" data-page="contacts"><span class="icon">👤</span> 联系人</a>
    <a href="#customers" data-page="customers"><span class="icon">🏢</span> 客户管理</a>
    <a href="#kanban" data-page="kanban"><span class="icon">📌</span> 看板</a>
    <a href="#activities" data-page="activities"><span class="icon">📝</span> 活动记录</a>
    <a href="#followups" data-page="followups"><span class="icon">🔔</span> 跟进提醒</a>
    <a href="#settings" data-page="settings"><span class="icon">⚙️</span> 系统设置</a>
  </nav>
</div>

<div class="main">
  <div class="header">
    <h1 id="pageTitle">仪表盘</h1>
    <div class="header-actions">
      <span id="headerInfo" style="font-size:13px;color:var(--tl)"></span>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<button class="mobile-toggle" id="mobileToggle" onclick="toggleSidebar()">☰</button>

<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="if(event.target===this)closeModal()"></div>

<script>
const API = '/api';

// ===== UTILITIES =====
async function api(path, opts = {}) {
  const url = API + path;
  const def = { headers: { 'Content-Type': 'application/json' } };
  const res = await fetch(url, { ...def, ...opts });
  const text = await res.text();
  if (!text) return null;
  try { return JSON.parse(text); } catch { return text; }
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
}

function fmtDate(d) {
  if (!d) return '-';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('zh-CN');
}

function fmtDateTime(d) {
  if (!d) return '-';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleString('zh-CN');
}

function dateInput(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return '';
  return dt.toISOString().slice(0, 10);
}

function datetimeInput(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return '';
  return dt.toISOString().slice(0, 16);
}

// ===== MODAL =====
function openModal(html) {
  document.getElementById('modalOverlay').style.display = 'flex';
  document.getElementById('modalOverlay').innerHTML = '<div class="modal">' + html + '</div>';
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
  document.getElementById('modalOverlay').innerHTML = '';
}

// ===== NAVIGATION =====
const pageTitles = {
  dashboard: '仪表盘', leads: '线索管理', opportunities: '商机管理',
  contacts: '联系人', customers: '客户管理', kanban: '看板管理',
  activities: '活动记录', followups: '跟进提醒', settings: '系统设置'
};

function navigate(page) {
  window.location.hash = page;
}

function onHashChange() {
  const page = window.location.hash.slice(1) || 'dashboard';
  document.querySelectorAll('.sidebar-nav a').forEach(a => {
    a.classList.toggle('active', a.dataset.page === page);
  });
  document.getElementById('pageTitle').textContent = pageTitles[page] || page;
  if (typeof render === 'function') render(page);
}

window.addEventListener('hashchange', onHashChange);

// ===== RENDER DISPATCHER =====
async function render(page) {
  const c = document.getElementById('content');
  const h = document.getElementById('pageTitle');
  if (!c) return;
  c.innerHTML = '<div class="empty-state">加载中...</div>';
  h.textContent = pageTitles[page] || page;
  document.querySelectorAll('.sidebar-nav a').forEach(a => {
    a.classList.toggle('active', a.dataset.page === page);
  });
  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');

  try {
    switch (page) {
      case 'dashboard': await renderDashboard(c); break;
      case 'leads': await renderLeads(c); break;
      case 'opportunities': await renderOpportunities(c); break;
      case 'contacts': await renderContacts(c); break;
      case 'customers': await renderCustomers(c); break;
      case 'kanban': await renderKanban(c); break;
      case 'activities': await renderActivities(c); break;
      case 'followups': await renderFollowups(c); break;
      case 'settings': await renderSettings(c); break;
      default: c.innerHTML = '<div class="empty-state">页面不存在</div>';
    }
  } catch (e) {
    console.error(e);
    c.innerHTML = '<div class="empty-state">加载失败: ' + esc(String(e.message || e)) + '</div>';
  }
}

// ===== SIDEBAR CLICK HANDLERS =====
document.querySelectorAll('.sidebar-nav a').forEach(a => {
  a.addEventListener('click', function (e) {
    e.preventDefault();
    navigate(this.dataset.page);
  });
});

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ===== DASHBOARD =====
async function renderDashboard(c) {
  const d = await api('/dashboard');
  if (!d) { c.innerHTML = '<div class="empty-state">加载失败</div>'; return; }
  const s = d.stats || {};
  c.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="stat-num">${s.active_leads || 0}</div><div class="stat-label">活跃线索</div></div>
      <div class="stat"><div class="stat-num">${s.opportunities || 0}</div><div class="stat-label">商机总数</div></div>
      <div class="stat"><div class="stat-num">${s.today_activities || 0}</div><div class="stat-label">今日活动</div></div>
      <div class="stat"><div class="stat-num">${s.urgent_leads || 0}</div><div class="stat-label">紧急线索</div></div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-title">🔥 紧急线索</div>
        ${(d.urgent_leads || []).length === 0 ? '<div class="empty-state">暂无紧急线索</div>' :
          '<div>' + (d.urgent_leads || []).map(l => `
            <div class="detail-row"><span class="lbl">标题</span><span>${esc(l.title)}</span></div>
            <div class="detail-row"><span class="lbl">匹配度</span><span class="badge badge-${l.level === '高匹配' ? 'high' : l.level === '中匹配' ? 'medium' : 'low'}">${esc(l.level || '-')}</span></div>
            <div class="detail-row"><span class="lbl">截止日期</span><span>${esc(l.deadline || '-')}</span></div>
            <div class="detail-row"><span class="lbl">关键词</span><span>${esc(l.match_keywords || '-')}</span></div>
          `).join('') + '</div>'}
      </div>
      <div class="card">
        <div class="card-title">📋 今日活动</div>
        ${(d.today_activities || []).length === 0 ? '<div class="empty-state">暂无今日活动</div>' :
          '<div>' + (d.today_activities || []).map(a => `
            <div class="detail-row"><span class="lbl">方式</span><span>${esc(a.method || '-')}</span></div>
            <div class="detail-row"><span class="lbl">内容</span><span>${esc(a.content)}</span></div>
            <div class="detail-row"><span class="lbl">时间</span><span>${esc(a.time ? fmtDateTime(a.time) : '-')}</span></div>
            <div class="detail-row"><span class="lbl">客户</span><span>${esc(a.customer_name || '-')}</span></div>
          `).join('') + '</div>'}
      </div>
      <div class="card">
        <div class="card-title">💼 最新商机</div>
        ${(d.opportunities || []).length === 0 ? '<div class="empty-state">暂无商机</div>' :
          '<div>' + (d.opportunities || []).slice(0, 5).map(o => `
            <div class="detail-row"><span class="lbl">标题</span><span>${esc(o.title)}</span></div>
            <div class="detail-row"><span class="lbl">阶段</span><span class="badge badge-active">${esc(o.stage || '-')}</span></div>
            <div class="detail-row"><span class="lbl">金额</span><span>${esc(o.amount || '-')}</span></div>
            <div class="detail-row"><span class="lbl">客户</span><span>${esc(o.customer_name || '-')}</span></div>
          `).join('') + '</div>'}
      </div>
      <div class="card">
        <div class="card-title">🔔 今日跟进</div>
        ${(d.today_followups || []).length === 0 ? '<div class="empty-state">暂无今日跟进</div>' :
          '<div>' + (d.today_followups || []).map(f => `
            <div class="detail-row"><span class="lbl">内容</span><span>${esc(f.content)}</span></div>
            <div class="detail-row"><span class="lbl">联系人</span><span>${esc(f.contact_name || '-')}</span></div>
            <div class="detail-row"><span class="lbl">计划日期</span><span>${esc(f.plan_date ? fmtDate(f.plan_date) : '-')}</span></div>
          `).join('') + '</div>'}
      </div>
    </div>
    ${(d.kanban_cards && d.kanban_cards.length) ? `
    <div class="card">
      <div class="card-title">📅 即将到来的看板截止日期</div>
      <table><thead><tr><th>卡片</th><th>截止日期</th><th>颜色</th></tr></thead>
      <tbody>${d.kanban_cards.map(k => `<tr><td>${esc(k.title)}</td><td>${esc(k.deadline || '-')}</td><td><span class="badge" style="background:${k.color === 'red' ? '#fee2e2' : k.color === 'yellow' ? '#fef3c7' : k.color === 'green' ? '#d1fae5' : '#dbeafe'}">${esc(k.color || '-')}</span></td></tr>`).join('')}</tbody>
      </table>
    </div>` : ''}
  `;
}

// ===== LEADS =====
async function renderLeads(c) {
  const d = await api('/leads');
  const list = Array.isArray(d) ? d : (d.data || []);
  c.innerHTML = `
    <div class="search-bar">
      <input placeholder="搜索线索标题..." id="lSearch" style="flex:1;min-width:200px">
      <select id="lStatus"><option value="">全部状态</option><option value="active">活跃</option><option value="converted">已转化</option><option value="abandoned">已废弃</option></select>
      <select id="lLevel"><option value="">全部匹配度</option><option value="高匹配">高匹配</option><option value="中匹配">中匹配</option><option value="低匹配">低匹配</option></select>
      <button class="btn btn-primary" onclick="loadLeads()">搜索</button>
      <button class="btn btn-success" onclick="showLeadForm()">+ 新增线索</button>
      <button class="btn btn-warning" onclick="triggerCrawl()">🕷️ 爬取</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>标号</th><th>标题</th><th>预算</th><th>截止日期</th><th>区域</th><th>匹配度</th><th>状态</th><th>客户</th><th>操作</th></tr></thead>
        <tbody id="lTableBody"></tbody>
      </table>
    </div>
  `;
  window._leadsList = list;
  renderLeadTable(list);
}

function renderLeadTable(list) {
  const tbody = document.getElementById('lTableBody');
  if (!tbody) return;
  if (!list.length) { tbody.innerHTML = '<tr><td colspan="9" class="empty-state">暂无线索</td></tr>'; return; }
  tbody.innerHTML = list.map(l => `
    <tr>
      <td style="white-space:nowrap">${esc(l.bid_number || '-')}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(l.title)}">${esc(l.title)}</td>
      <td>${esc(l.budget || '-')}</td>
      <td>${esc(l.deadline || '-')}</td>
      <td>${esc(l.region || '-')}</td>
      <td><span class="badge badge-${l.match_level === '高匹配' ? 'high' : l.match_level === '中匹配' ? 'medium' : 'low'}">${esc(l.match_level || '-')}</span></td>

async function renderKanban(c) {
  const d = await api('/kanban/boards');
  const boards = Array.isArray(d) ? d : (d.data || []);
  if (!boards.length) {
    c.innerHTML = '<div class="card"><div class="empty-state">暂无看板</div><button class="btn btn-success" onclick="createBoard()">创建首个看板</button></div>';
    return;
  }
  window._kanbanBoards = boards;
  c.innerHTML = `
    <div class="search-bar">
      <select id="kBoard" onchange="loadKanbanBoard()">${boards.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select>
      <button class="btn btn-success" onclick="createBoard()">+ 新建看板</button>
      <button class="btn btn-primary" onclick="addColumn()">+ 添加列表</button>
      <button class="btn btn-info" onclick="showImportModal()">📥 导入卡片</button>
      <button class="btn btn-danger" onclick="deleteBoard()">删除看板</button>
    </div>
    <div class="kanban-board" id="kanbanBoard"></div>
  `;
  loadKanbanBoard();
}

function loadKanbanBoard() {
  const boardId = document.getElementById('kBoard').value;
  const board = (window._kanbanBoards || []).find(b => b.id === parseInt(boardId));
  if (!board) return;
  window._kanban = board;
  const container = document.getElementById('kanbanBoard');
  container.innerHTML = (board.columns || []).map(col => `
    <div class="kanban-col" data-col-id="${col.id}">
      <div class="kanban-col-header">${esc(col.name)} (${(col.cards || []).length})</div>
      <div class="kanban-col-body" data-col-id="${col.id}"
        ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
        ${(col.cards || []).map(card => `
          <div class="kanban-card kanban-card-${card.color || 'blue'}" draggable="true"
            data-card-id="${card.id}" ondragstart="handleDragStart(event)" ondragend="handleDragEnd(event)">
            <div class="card-title">${esc(card.title)}</div>
            ${card.description ? `<div class="card-desc">${esc(card.description)}</div>` : ''}
            ${card.deadline ? `<div class="card-deadline">📅 ${esc(card.deadline)}</div>` : ''}
            <div class="btn-group" style="margin-top:6px">
              <button class="btn btn-sm" onclick="moveCardPrompt(${card.id})">移动</button>
              <button class="btn btn-sm btn-danger" onclick="deleteCard(${card.id})">删除</button>
            </div>
          </div>
        `).join('')}
        <div style="text-align:center;padding:8px;color:var(--tl);font-size:12px" onclick="showAddCard(${col.id})">+ 添加卡片</div>
      </div>
    </div>
  `).join('');
}

let _dragCardId = null;

function handleDragStart(e) {
  _dragCardId = parseInt(e.target.dataset.cardId);
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', _dragCardId);
}

function handleDragEnd(e) {
  e.target.classList.remove('dragging');
  _dragCardId = null;
}

function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const body = e.target.closest('.kanban-col-body');
  if (body) body.classList.add('drag-over');
}

function handleDragLeave(e) {
  const body = e.target.closest('.kanban-col-body');
  if (body) body.classList.remove('drag-over');
}

async function handleDrop(e) {
  e.preventDefault();
  const body = e.target.closest('.kanban-col-body');
  if (!body || !_dragCardId) return;
  body.classList.remove('drag-over');
  const colId = parseInt(body.dataset.colId);
  await api('/kanban/cards/' + _dragCardId + '/move', { method: 'POST', body: JSON.stringify({ column_id: colId }) });
  toast('移动成功', 'success');
  render('kanban');
}

    const customers = Array.isArray(custs) ? custs : (custs.data || []);
    api('/contacts').then(conts => {
      const contacts = Array.isArray(conts) ? conts : (conts.data || []);
      openModal(`
        <h3>${isEdit ? '编辑跟进' : '新增跟进'}</h3>
        <div class="form-row">
          <div class="form-group"><label>客户</label>
            <select id="fu_cust"><option value="">无</option>
              ${customers.map(cu => `<option value="${cu.id}" ${data?.customer_id === cu.id ? 'selected' : ''}>${esc(cu.name)}</option>`).join('')}
            </select>
          </div>
          <div class="form-group"><label>联系人</label>
            <select id="fu_cont"><option value="">无</option>
              ${contacts.map(ct => `<option value="${ct.id}" ${data?.contact_id === ct.id ? 'selected' : ''}>${esc(ct.name)}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>计划日期</label><input id="fu_date" type="date" value="${dateInput(data?.plan_date)}"></div>
        </div>
        <div class="form-group"><label>跟进内容</label><textarea id="fu_content">${esc(data?.content || '')}</textarea></div>
        <div class="form-group"><label>AI建议内容</label><textarea id="fu_ai">${esc(data?.ai_suggested_content || '')}</textarea></div>
        ${isEdit && data?.actual_date ? `
          <div class="form-row">
            <div class="form-group"><label>实际完成日期</label><input id="fu_actual_date" type="date" value="${dateInput(data?.actual_date)}"></div>
          </div>
          <div class="form-group"><label>实际跟进内容</label><textarea id="fu_actual">${esc(data?.actual_content || '')}</textarea></div>
        ` : ''}
        <div class="modal-actions">
          <button class="btn" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="saveFollowup(${id || ''})">${isEdit ? '保存' : '创建'}</button>
        </div>
      `);
    });
  });
}

async function saveFollowup(id) {
  const body = {
    customer_id: parseInt(document.getElementById('fu_cust').value) || null,
    contact_id: parseInt(document.getElementById('fu_cont').value) || null,
    plan_date: document.getElementById('fu_date').value || null,
    content: document.getElementById('fu_content').value,
    ai_content: document.getElementById('fu_ai').value,
  };
  if (id) {
    body.actual_date = document.getElementById('fu_actual_date')?.value || null;
    body.actual_content = document.getElementById('fu_actual')?.value || '';
  }
  const url = id ? '/followups/' + id : '/followups';
  const method = id ? 'PUT' : 'POST';
  await api(url, { method, body: JSON.stringify(body) });
  toast(id ? '更新成功' : '创建成功', 'success');
  closeModal();
  render('followups');
}

async function completeFollowup(id) {
  const content = prompt('实际跟进内容:');
  if (content === null) return;
  const today = new Date().toISOString().slice(0, 10);
  await api('/followups/' + id, { method: 'PUT', body: JSON.stringify({ actual_date: today, actual_content: content }) });
  toast('已标记完成', 'success');
  render('followups');
}

async function deleteFollowup(id) {
  if (!confirm('确认删除此跟进？')) return;
  await api('/followups/' + id, { method: 'DELETE' });
  toast('已删除', 'success');
  render('followups');
}

// ===== SETTINGS =====
async function renderSettings(c) {
  const d = await api('/config');
  const config = d && d.data ? d : (d || {});
  const sk = await api('/skills');
  const skillList = Array.isArray(sk) ? sk : (sk?.skills || sk?.data || []);
  c.innerHTML = `
    <div class="card">
      <div class="section-title">⚙️ 系统配置</div>
      <div class="settings-row"><span class="settings-label">系统名称</span><input id="cfg_name" value="${esc(config.name?.value || '林业无人机CRM')}" style="width:200px"></div>
      <div class="settings-row"><span class="settings-label">公司名称</span><input id="cfg_company" value="${esc(config.company?.value || '')}" style="width:200px"></div>
      <div class="settings-row"><span class="settings-label">主题色</span><input id="cfg_color" value="${esc(config.color?.value || '#15803d')}" type="color" style="width:60px"></div>
      <button class="btn btn-primary" onclick="saveConfig()" style="margin-top:12px">保存配置</button>
    </div>
    <div class="card">
      <div class="section-title">🧠 AI 配置</div>
      <div class="settings-row"><span class="settings-label">API Key</span><input id="cfg_ai_key" type="password" value="${esc(config.ai_api_key?.value || '')}" placeholder="sk-..." style="width:300px"></div>
      <div class="settings-row"><span class="settings-label">API Endpoint</span><input id="cfg_ai_endpoint" value="${esc(config.ai_api_endpoint?.value || '')}" placeholder="https://api.openai.com/v1" style="width:300px"></div>
      <div class="settings-row"><span class="settings-label">AI 模型</span><input id="cfg_ai_model" value="${esc(config.ai_model?.value || 'gpt-4o')}" style="width:200px"></div>
      <button class="btn btn-primary" onclick="saveAIConfig()" style="margin-top:12px">保存AI配置</button>
    </div>
    <div class="card">
      <div class="section-title">🛠️ 技能管理</div>
      ${skillList.length ? skillList.map(s => '<span class="skill-badge" onclick="executeSkill(\'' + esc(s.name || s) + '\')" title="点击执行">' + esc(s.name || s) + '</span>').join('') : '<div class="empty-state">暂无技能</div>'}
    </div>
    <div class="card">
      <div class="section-title">🕷️ 数据采集</div>
      <div class="form-group"><label>目标URL</label><input id="crawlUrl" placeholder="https://example.com" value="${esc(config.crawl_urls?.value || '')}"></div>
      <button class="btn btn-success" onclick="startCrawl()">开始采集</button>
    </div>
  `;
}

async function saveConfig() {
  const body = {
    name: document.getElementById('cfg_name').value,
    company: document.getElementById('cfg_company').value,
    color: document.getElementById('cfg_color').value,
  };
  await api('/config', { method: 'PUT', body: JSON.stringify(body) });
  toast('配置已保存', 'success');
}

async function saveAIConfig() {
  const body = {
    ai_api_key: document.getElementById('cfg_ai_key').value,
    ai_api_endpoint: document.getElementById('cfg_ai_endpoint').value,
    ai_model: document.getElementById('cfg_ai_model').value,
  };
  await api('/config', { method: 'PUT', body: JSON.stringify(body) });
  toast('AI配置已保存', 'success');
}

async function executeSkill(name) {
  const r = await api('/skills/' + encodeURIComponent(name) + '/execute', { method: 'POST', body: JSON.stringify({}) });
  toast('技能执行完成: ' + (r?.message || name), 'success');
}

async function startCrawl() {
  const url = document.getElementById('crawlUrl').value;
  if (!url) return toast('请输入URL', 'error');
  const res = await api('/crawl', { method: 'POST', body: JSON.stringify({ url }) });
  toast(res?.message || '采集任务已启动', 'success');
}

// ===== INIT =====
const initialPage = window.location.hash.slice(1) || 'dashboard';
onHashChange();
</script>
</body>
</html>
