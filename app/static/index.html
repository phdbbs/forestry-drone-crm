<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>林业无人机CRM系统 v3.0</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#166534;--pl:#22c55e;--pd:#14532d;--sw:220px;--bg:#f8fafc;--cb:#fff;--tx:#0f172a;--tl:#64748b;--brd:#e2e8f0;--dn:#ef4444;--wn:#f59e0b;--ok:#16a34a;--if:#3b82f6;--purple:#8b5cf6}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
.sidebar{position:fixed;left:0;top:0;width:var(--sw);height:100vh;background:linear-gradient(180deg,#14532d 0%,#166534 50%,#15803d 100%);color:#fff;z-index:100;overflow-y:auto;display:flex;flex-direction:column}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.sidebar-logo .logo-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:#f59e0b}
.sidebar-logo .logo-text{font-size:14px;font-weight:700;color:#fff}
.sidebar-logo .logo-sub{font-size:11px;color:rgba(255,255,255,.6)}
.sidebar-nav{padding:8px 0;flex:1}
.sidebar-nav a{display:flex;align-items:center;gap:10px;padding:10px 16px;color:rgba(255,255,255,.7);text-decoration:none;font-size:13px;transition:all .15s;cursor:pointer;border-right:3px solid transparent}
.sidebar-nav a:hover{background:rgba(255,255,255,.12)}
.sidebar-nav a.active{background:rgba(255,255,255,.18);color:#fff;border-right-color:#f59e0b}
.sidebar-nav a.active .nav-icon{color:#f59e0b}
.sidebar-nav a .nav-icon{color:rgba(255,255,255,.5);display:flex;align-items:center}
.sidebar-user{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:8px}
.sidebar-user .avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.main{margin-left:var(--sw);min-height:100vh;display:flex;flex-direction:column;flex:1}
.header{background:#fff;padding:14px 24px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.header h1{font-size:18px;font-weight:700;color:var(--tx)}
.header-actions{display:flex;gap:8px;align-items:center}
.notif-badge{position:relative;cursor:pointer;padding:6px;border-radius:8px;transition:background .2s}
.notif-badge:hover{background:#f1f5f9}
.notif-badge .count{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:var(--dn);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:600}
.content{flex:1;padding:24px;overflow-y:auto}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--cb);border-radius:12px;padding:20px;border:1px solid var(--brd);transition:box-shadow .2s}
.stat:hover{box-shadow:0 4px 12px rgba(0,0,0,.06)}
.stat-num{font-size:28px;font-weight:700;color:var(--primary)}
.stat-label{font-size:13px;color:var(--tl);margin-top:4px}
.stat-change{font-size:12px;margin-top:4px;display:flex;align-items:center;gap:4px}
.card{background:var(--cb);border-radius:12px;padding:20px;border:1px solid var(--brd);margin-bottom:16px;transition:box-shadow .2s}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.04)}
.card-title{font-size:15px;font-weight:600;color:var(--tx);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:none;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;text-decoration:none;font-family:inherit;background:#f1f5f9;color:#475569}
.btn:hover{background:#e2e8f0}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--pd)}
.btn-success{background:var(--ok);color:#fff}
.btn-danger{background:var(--dn);color:#fff}.btn-danger:hover{background:#dc2626}
.btn-warning{background:var(--wn);color:#fff}
.btn-info{background:var(--if);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:9999px;font-size:12px;font-weight:500}
.badge-high{background:#fef2f2;color:#dc2626}
.badge-medium{background:#eff6ff;color:#2563eb}
.badge-low{background:#f1f5f9;color:#64748b}
.badge-active{background:#d1fae5;color:#065f46}
.badge-converted{background:#e0e7ff;color:#3730a3}
.badge-abandoned{background:#fee2e2;color:#991b1b}
.badge-pool{background:#fef3c7;color:#92400e}
.search-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-bar input,.search-bar select{min-width:140px;flex:0 1 auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--brd);font-size:13px}
th{background:#f8fafc;color:#475569;font-weight:600;position:sticky;top:0}
tr:hover{background:#f8fafc}
tr.expandable{cursor:pointer}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--tl)}
.form-row{display:flex;gap:12px;flex-wrap:wrap}.form-row .form-group{flex:1;min-width:180px}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--brd);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,101,52,.1)}
textarea{resize:vertical;min-height:80px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:600px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{margin-bottom:16px;color:var(--tx);font-size:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.progress-bar{height:8px;border-radius:4px;background:#e2e8f0;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .5s ease}
.tab-btn{padding:8px 16px;font-size:13px;font-weight:500;border:none;background:transparent;cursor:pointer;color:#64748b;border-bottom:2px solid transparent;transition:all .15s}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.urgency-high{background:#fef2f2;border-left:4px solid #ef4444}
.urgency-medium{background:#fff7ed;border-left:4px solid #f97316}
.urgency-low{background:#fffbeb;border-left:4px solid #f59e0b}
.kanban-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:16px;min-height:400px}
.kanban-col{min-width:260px;flex:1;background:#f9fafb;border-radius:12px;padding:12px;display:flex;flex-direction:column;border-top:3px solid #d1d5db}
.kanban-col.drag-over{background:#f0fdf4;border-color:var(--primary)}
.kanban-col-header{font-weight:600;padding:8px;font-size:13px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.kanban-col-body{flex:1;min-height:100px}
.kanban-card{background:#fff;border-radius:8px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:grab;transition:transform .1s,box-shadow .2s;border:1px solid var(--brd)}
.kanban-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.kanban-card.dragging{opacity:.5;transform:rotate(2deg)}
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--brd)}
.timeline-item{position:relative;padding-bottom:16px}
.timeline-item::before{content:'';position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary)}
.timeline-item .tl-date{font-size:11px;color:var(--tl)}
.timeline-item .tl-content{font-size:13px;margin-top:2px}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-size:14px;z-index:300;animation:slideIn .3s ease;max-width:320px}
.toast-success{background:var(--ok)}
.toast-error{background:var(--dn)}
.toast-info{background:var(--if)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.empty-state{text-align:center;padding:40px;color:var(--tl);font-size:14px}
.contact-card{background:#fff;border-radius:12px;border:1px solid var(--brd);padding:20px;transition:box-shadow .2s}
.contact-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.06)}
.contact-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.ai-panel{background:#f5f3ff;border:1px solid #e9d5ff;border-radius:12px;padding:16px}
.ai-item{padding:10px 12px;background:#fff;border-radius:8px;border:1px solid #e9d5ff;margin-bottom:8px;font-size:13px;color:#4c1d95;display:flex;align-items:flex-start;gap:8px}
.pipeline-stage{text-align:center;flex:1}
.pipeline-circle{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:18px;font-weight:700}
.pipeline-connector{flex:0.3;height:2px;background:#e2e8f0;align-self:center;margin-top:-20px}
.expand-row{background:#f8fafc;border-top:1px solid var(--brd)}
.expand-row td{padding:16px 24px}
.settings-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f3f4f6}
.settings-label{min-width:100px;font-size:14px;font-weight:500;color:var(--tl)}
.skill-badge{display:inline-block;padding:6px 14px;background:#f0fdf4;border:1px solid var(--brd);border-radius:20px;font-size:13px;margin:4px;cursor:pointer;transition:all .2s}
.skill-badge:hover{background:var(--primary);color:#fff}
.mobile-toggle{display:none;position:fixed;bottom:16px;right:16px;z-index:150;width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2)}
@media(max-width:768px){
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.main{margin-left:0}
.mobile-toggle{display:block}
.grid2,.grid3,.grid4{grid-template-columns:1fr}
.stats{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5l4 4"/><path d="M19 5l-4 4"/><path d="M5 19l4-4"/><path d="M19 19l-4-4"/><circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg></div>
    <div><div class="logo-text">林业无人机CRM</div><div class="logo-sub">Forest Drone CRM v3.0</div></div>
  </div>
  <nav class="sidebar-nav" id="sideNav"></nav>
  <div class="sidebar-user">
    <div class="avatar">李</div>
    <div><div style="font-size:12px;font-weight:500;color:#fff">李明</div><div style="font-size:10px;color:rgba(255,255,255,.5)">销售总监</div></div>
  </div>
</div>
<div class="main">
  <div class="header">
    <h1 id="pageTitle">智能工作台</h1>
    <div class="header-actions">
      <div class="notif-badge" id="notifBadge" title="通知">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="count" id="notifCount" style="display:none">0</span>
      </div>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>
<button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div id="modalRoot"></div>

<script>
// ===== SVG Icons =====
const IC = {
  grid: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
  users: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>',
  target: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
  layers: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
  user: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="8" r="3"/><path d="M6.168 18.849A4 4 0 0110 16h4a4 4 0 013.834 2.855"/></svg>',
  phone: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>',
  kanban: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="5" height="7" rx="1"/></svg>',
  chart: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
  settings: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>',
  plus: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  clock: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  eye: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  edit: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
  trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>',
  lightning: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
  check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>',
  download: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
  arrowUp: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>',
  arrowDown: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>',
  fire: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22c-4.97 0-9-2.69-9-6s4.03-6 9-6c.28-3.5 2-8 5-10 0 4 3 6 3 10s-3.03 6-8 6z"/></svg>'
};

// ===== Navigation =====
const NAV = [
  {id:'dashboard',label:'智能工作台',icon:IC.grid},
  {id:'leads',label:'线索管理',icon:IC.target},
  {id:'opportunities',label:'商机管理',icon:IC.layers},
  {id:'contacts',label:'联系人管理',icon:IC.user},
  {id:'customers',label:'客户管理',icon:IC.users},
  {id:'contactlog',label:'日常联络',icon:IC.phone},
  {id:'kanban',label:'看板管理',icon:IC.kanban},
  {id:'reports',label:'数据报表',icon:IC.chart},
  {id:'settings',label:'系统设置',icon:IC.settings}
];
const TITLES = {dashboard:'智能工作台',leads:'线索管理',opportunities:'商机管理',contacts:'联系人管理',customers:'客户管理',contactlog:'日常联络',kanban:'看板管理',reports:'数据报表',settings:'系统设置'};

// ===== Utilities =====
async function api(path, opts={}){
  const res = await fetch('/api'+path, {headers:{'Content-Type':'application/json'}, ...opts});
  return res.json();
}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function toast(msg, type='success'){
  const el=document.createElement('div');el.className='toast toast-'+type;el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),3000);
}
function fmtDate(d){return d?d.substring(0,10):''}
function matchColor(score){return score>=80?'#166534':score>=60?'#f59e0b':score>=40?'#3b82f6':'#ef4444'}
function probColor(p){return p>=80?'#166534':p>=50?'#f59e0b':p>=30?'#3b82f6':'#ef4444'}

// ===== Searchable Select Component =====
function makeSearchable(selectId){
  const sel=document.getElementById(selectId);
  if(!sel||sel._ssInit)return;
  sel._ssInit=true;sel.style.display='none';
  const wrap=document.createElement('div');wrap.style.cssText='position:relative';
  const trigger=document.createElement('div');
  trigger.style.cssText='padding:8px 12px;border:1px solid var(--brd);border-radius:8px;font-size:14px;cursor:pointer;background:#fff;display:flex;align-items:center;justify-content:space-between';
  trigger.innerHTML=`<span>${sel.options[sel.selectedIndex]?.text||'请选择'}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>`;
  const panel=document.createElement('div');
  panel.style.cssText='position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--brd);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:99;display:none;margin-top:4px;max-height:220px;overflow-y:auto';
  const searchBox=document.createElement('input');
  searchBox.placeholder='搜索...';searchBox.style.cssText='border:none;border-bottom:1px solid var(--brd);border-radius:8px 8px 0 0;padding:8px 12px;font-size:13px;outline:none;position:sticky;top:0;background:#fff';
  panel.appendChild(searchBox);
  const optWrap=document.createElement('div');panel.appendChild(optWrap);
  function buildOpts(filter=''){
    optWrap.innerHTML='';
    Array.from(sel.options).forEach(opt=>{
      if(filter&&!opt.text.toLowerCase().includes(filter.toLowerCase()))return;
      const d=document.createElement('div');
      d.style.cssText='padding:8px 12px;font-size:13px;cursor:pointer;transition:background .1s';
      d.textContent=opt.text;d.dataset.val=opt.value;
      if(opt.value===sel.value)d.style.cssText+='background:#f0fdf4;font-weight:600';
      d.onmouseenter=()=>d.style.background='#f1f5f9';
      d.onmouseleave=()=>d.style.background=opt.value===sel.value?'#f0fdf4':'';
      d.onclick=()=>{sel.value=opt.value;trigger.querySelector('span').textContent=opt.text;panel.style.display='none';sel.dispatchEvent(new Event('change'))};
      optWrap.appendChild(d);
    });
  }
  searchBox.oninput=()=>buildOpts(searchBox.value);
  trigger.onclick=(e)=>{e.stopPropagation();closeAllSSelects(panel);panel.style.display=panel.style.display==='none'?'block':'none';if(panel.style.display==='block'){buildOpts();searchBox.value='';searchBox.focus()}};
  wrap.appendChild(trigger);wrap.appendChild(panel);sel.after(wrap);
  sel._ssTrigger=trigger;sel._ssPanel=panel;sel._ssBuild=buildOpts;
}
function closeAllSSelects(except){document.querySelectorAll('[style*="display: block"],[style*="display:block"]').forEach(p=>{if(p!==except&&p.style)p.style.display='none'})}
function refreshSearchable(id){const sel=document.getElementById(id);if(sel&&sel._ssBuild){sel._ssBuild();sel._ssTrigger.querySelector('span').textContent=sel.options[sel.selectedIndex]?.text||'请选择'}}
function initSearchableInModal(){document.querySelectorAll('.modal select[data-searchable]').forEach(s=>{makeSearchable(s.id)})}
document.addEventListener('click',()=>closeAllSSelects());

function onHashChange(){

  document.querySelectorAll('.sidebar-nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===page));

// ===== Page Dispatcher =====
async function render(page){
  const c=document.getElementById('content');
  c.innerHTML='<div class="empty-state">加载中...</div>';
  switch(page){
    case 'dashboard': await renderDashboard(c);break;
    case 'leads': await renderLeads(c);break;
    case 'opportunities': await renderOpportunities(c);break;
    case 'contacts': await renderContacts(c);break;
    case 'customers': await renderCustomers(c);break;
    case 'contactlog': await renderContactLog(c);break;
    case 'kanban': await renderKanban(c);break;
    case 'reports': await renderReports(c);break;
    case 'settings': await renderSettings(c);break;
    default: c.innerHTML='<div class="empty-state">页面不存在</div>';
  }
}

async function saveActivity(){
  const d={customer_id:document.getElementById('afCustomer').value||null,contact_id:document.getElementById('afContact').value||null,method:document.getElementById('afMethod').value,time:document.getElementById('afTime').value?document.getElementById('afTime').value.replace('T',' '):'',content:document.getElementById('afContent').value,next_time:document.getElementById('afNextTime').value,next_content:document.getElementById('afNextContent').value};
  await api('/activities',{method:'POST',body:JSON.stringify(d)});
  toast('创建成功');closeModal();renderContactLog(document.getElementById('content'));
}
async function deleteActivity(id){
  if(!confirm('确认删除？'))return;
  await api(`/activities/${id}`,{method:'DELETE'});toast('已删除');renderContactLog(document.getElementById('content'));
}
function showFollowupForm(){
  openModal(`<h3>新建联络计划</h3>
    <div class="form-group"><label>计划日期</label><input id="fuDate" type="date"></div>
    <div class="form-group"><label>内容</label><textarea id="fuContent"></textarea></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveFollowupPlan()">保存</button></div>`);
}
async function saveFollowupPlan(){
  const d={plan_date:document.getElementById('fuDate').value,content:document.getElementById('fuContent').value};
  if(!d.content){toast('请输入内容','error');return}
  await api('/followups',{method:'POST',body:JSON.stringify(d)});
  toast('创建成功');closeModal();renderContactLog(document.getElementById('content'));
}
async function completeFollowup(id){
  await api(`/followups/${id}`,{method:'PUT',body:JSON.stringify({actual_date:new Date().toISOString().slice(0,10),actual_content:'已完成'})});
  toast('已标记完成');renderContactLog(document.getElementById('content'));
}
async function deleteFollowup(id){
  if(!confirm('确认删除？'))return;
  await api(`/followups/${id}`,{method:'DELETE'});toast('已删除');renderContactLog(document.getElementById('content'));
}

// ===== 7. Kanban =====
async function renderKanban(c){
  const boards=await api('/kanban/boards');
  if(!boards.length){
    c.innerHTML=`<div class="fade-in"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><h2 style="font-size:18px;font-weight:700">看板管理</h2><button class="btn btn-primary" onclick="createBoard()">${IC.plus} 新建看板</button></div><div class="empty-state">暂无看板，点击上方按钮创建</div></div>`;
    return;
  }
  const board=boards[0];
  c.innerHTML=`<div class="fade-in">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <h2 style="font-size:18px;font-weight:700">${esc(board.name)}</h2>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="addColumn(${board.id})">${IC.plus} 添加列</button>
        <button class="btn" onclick="showAddCard(${board.id})">${IC.plus} 添加卡片</button>
        <button class="btn btn-primary" onclick="createBoard()">${IC.plus} 新建看板</button>
      </div>
    </div>
    <div class="kanban-board">${board.columns.map(col=>`
      <div class="kanban-col" data-col="${col.id}" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="dropCard(event,${col.id});this.classList.remove('drag-over')">
        <div class="kanban-col-header"><span>${esc(col.name)}</span><span class="badge" style="background:#f1f5f9;color:#64748b">${col.cards.length}</span></div>
        <div class="kanban-col-body">${col.cards.map(card=>`
          <div class="kanban-card" draggable="true" ondragstart="event.dataTransfer.setData('text','${card.id}')" style="border-left:4px solid ${card.color==='red'?'var(--dn)':card.color==='yellow'?'var(--wn)':card.color==='green'?'var(--ok)':'var(--if)'}">
            <div style="font-weight:500;font-size:13px;margin-bottom:4px">${esc(card.title)}</div>
            ${card.description?`<div style="font-size:12px;color:var(--tl);margin-bottom:4px">${esc(card.description).substring(0,60)}</div>`:''}
            ${card.deadline?`<div style="font-size:11px;color:var(--dn)">${IC.clock} ${fmtDate(card.deadline)}</div>`:''}
            <div style="margin-top:6px;text-align:right"><button class="btn btn-sm" style="padding:2px 6px;color:var(--dn)" onclick="deleteCard(${card.id})">${IC.trash}</button></div>
          </div>`).join('')}
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}
async function createBoard(){
  const name=prompt('看板名称:','新看板');if(!name)return;
  await api('/kanban/boards',{method:'POST',body:JSON.stringify({name})});
  toast('创建成功');renderKanban(document.getElementById('content'));
}
async function addColumn(boardId){
  const name=prompt('列名称:');if(!name)return;
  await api(`/kanban/boards/${boardId}/columns`,{method:'POST',body:JSON.stringify({name})});
  toast('已添加');renderKanban(document.getElementById('content'));
}
function showAddCard(boardId){
  openModal(`<h3>添加卡片</h3>
    <div class="form-group"><label>标题 *</label><input id="kcTitle"></div>
    <div class="form-group"><label>描述</label><textarea id="kcDesc"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label>颜色</label><select id="kcColor"><option value="blue">蓝色</option><option value="green">绿色</option><option value="yellow">黄色</option><option value="red">红色</option></select></div>
      <div class="form-group"><label>截止日期</label><input id="kcDeadline" type="date"></div>
    </div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveCard(${boardId})">保存</button></div>`);
}
async function saveCard(boardId){
  const title=document.getElementById('kcTitle').value;
  if(!title){toast('请输入标题','error');return}
  const boards=await api('/kanban/boards');
  const board=boards.find(b=>b.id===boardId);
  const colId=board?.columns[0]?.id;
  if(!colId){toast('无可用列','error');return}
  await api('/kanban/import',{method:'POST',body:JSON.stringify({board_id:boardId,items:[{title,description:document.getElementById('kcDesc').value,color:document.getElementById('kcColor').value}]})});
  toast('已添加');closeModal();renderKanban(document.getElementById('content'));
}
async function dropCard(event,colId){
  event.preventDefault();
  const cardId=event.dataTransfer.getData('text');
  if(!cardId)return;
  await api(`/kanban/cards/${cardId}/move`,{method:'POST',body:JSON.stringify({column_id:colId})});
  renderKanban(document.getElementById('content'));
}
async function deleteCard(id){
  if(!confirm('确认删除？'))return;
  await api(`/kanban/cards/${id}`,{method:'DELETE'});toast('已删除');renderKanban(document.getElementById('content'));
}

// ===== 8. Reports (Chart.js) =====
let chartInstances=[];
async function renderReports(c){
  chartInstances.forEach(ch=>ch.destroy());chartInstances=[];
  const data=await api('/analytics');
  const s=data.summary;
  c.innerHTML=`<div class="fade-in">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <h2 style="font-size:18px;font-weight:700">数据报表</h2>
    </div>
    <div class="grid4" style="margin-bottom:24px">
      <div class="stat"><div class="stat-label">总线索数</div><div class="stat-num">${s.total_leads}</div></div>
      <div class="stat"><div class="stat-label">商机总数</div><div class="stat-num">${s.total_opportunities}</div></div>
      <div class="stat"><div class="stat-label">商机总金额</div><div class="stat-num">${s.total_amount}万</div></div>
      <div class="stat"><div class="stat-label">转化率</div><div class="stat-num">${s.conversion_rate}%</div></div>
    </div>
    <div class="grid2">
      <div class="card"><div class="card-title">线索月度趋势</div><canvas id="chartMonthly" height="200"></canvas></div>
      <div class="card"><div class="card-title">商机漏斗</div><canvas id="chartFunnel" height="200"></canvas></div>
    </div>
    <div class="grid2" style="margin-top:16px">
      <div class="card"><div class="card-title">赢单/丢单分布</div><canvas id="chartWinLoss" height="200"></canvas></div>
      <div class="card"><div class="card-title">阶段分布</div><canvas id="chartStages" height="200"></canvas></div>
    </div>
  </div>`;
  // Monthly trend
  const ctx1=document.getElementById('chartMonthly').getContext('2d');
  chartInstances.push(new Chart(ctx1,{type:'line',data:{labels:data.monthly_leads.map(m=>m.month),datasets:[{label:'新增线索',data:data.monthly_leads.map(m=>m.leads),borderColor:'#166534',backgroundColor:'rgba(22,101,52,.1)',fill:true,tension:.4},{label:'已转化',data:data.monthly_leads.map(m=>m.converted),borderColor:'#f59e0b',backgroundColor:'rgba(245,158,11,.1)',fill:true,tension:.4}]},options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true}}}}));
  // Funnel
  const ctx2=document.getElementById('chartFunnel').getContext('2d');
  chartInstances.push(new Chart(ctx2,{type:'bar',data:{labels:data.funnel.map(f=>f.stage),datasets:[{label:'金额(万)',data:data.funnel.map(f=>f.amount),backgroundColor:STAGE_COLORS}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true}}}}));
  // Win/Loss pie
  const ctx3=document.getElementById('chartWinLoss').getContext('2d');
  chartInstances.push(new Chart(ctx3,{type:'doughnut',data:{labels:data.win_loss.map(w=>w.name),datasets:[{data:data.win_loss.map(w=>w.value),backgroundColor:['#166534','#3b82f6','#ef4444']}]},options:{responsive:true,plugins:{legend:{position:'bottom'}}}}));
  // Stage distribution
  const ctx4=document.getElementById('chartStages').getContext('2d');
  chartInstances.push(new Chart(ctx4,{type:'bar',data:{labels:data.funnel.map(f=>f.stage),datasets:[{label:'商机数',data:data.funnel.map(f=>f.count),backgroundColor:STAGE_COLORS.map(c=>c+'80')}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}));
}

// ===== 9. Settings =====
async function renderSettings(c){
  const config=await api('/config');
  const getV=(k,d='')=>config[k]?.value||d;
  c.innerHTML=`<div class="fade-in">
    <h2 style="font-size:18px;font-weight:700;margin-bottom:16px">系统设置</h2>
    <div class="grid2">
      <div class="card">
        <div class="card-title">AI 配置</div>
        <div class="form-group"><label>API Endpoint</label><input id="cfgEndpoint" value="${esc(getV('ai_api_endpoint','https://api.openai.com/v1'))}"></div>
        <div class="form-group"><label>API Key</label><input id="cfgKey" type="password" value="${esc(getV('ai_api_key',''))}"></div>
        <div class="form-group"><label>模型</label><input id="cfgModel" value="${esc(getV('ai_model','gpt-4o'))}"></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" onclick="saveAIConfig()">保存配置</button>
          <button class="btn" onclick="testAI()">测试连接</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">爬取配置</div>
        <div class="form-group"><label>关键词(逗号分隔)</label><input id="cfgKeywords" value="${esc(getV('keywords','无人机,林业,病虫害,巡检'))}"></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" onclick="saveKeywords()">保存</button>
          <button class="btn" onclick="triggerCrawl()">${IC.lightning} 立即采集</button>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-title">技能管理</div>
      <div id="skillList">加载中...</div>
    </div>
  </div>`;
  loadSkills();
}
async function saveAIConfig(){
  await api('/config',{method:'PUT',body:JSON.stringify({ai_api_endpoint:document.getElementById('cfgEndpoint').value,ai_api_key:document.getElementById('cfgKey').value,ai_model:document.getElementById('cfgModel').value})});
  toast('AI配置已保存');
}
async function testAI(){
  toast('测试中...','info');
  const r=await api('/config/test-ai',{method:'POST'});
  if(r.ok)toast(r.message);else toast(r.error||'连接失败','error');
}
async function saveKeywords(){
  await api('/config',{method:'PUT',body:JSON.stringify({keywords:document.getElementById('cfgKeywords').value})});
  toast('关键词已保存');
}
async function loadSkills(){
  const data=await api('/skills');
  const el=document.getElementById('skillList');
  if(!el)return;
  const all=[...(data.builtin||[]).map(s=>({...s,is_builtin:true})),...(data.custom||[])];
  el.innerHTML=all.map(s=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9">
    <div><span class="skill-badge" style="cursor:default">${s.icon||'🔧'} ${esc(s.name)}</span><span style="font-size:12px;color:var(--tl)">${esc(s.description||'')}</span></div>
    <div style="display:flex;gap:4px;align-items:center">
      <span class="badge ${s.is_active?'badge-active':'badge-low'}">${s.is_active?'启用':'禁用'}</span>
      ${!s.is_builtin?`<button class="btn btn-sm" style="color:var(--dn)" onclick="deleteSkill(${s.id})">${IC.trash}</button>`:''}
    </div>
  </div>`).join('')||'<div class="empty-state">暂无技能</div>';
}
async function deleteSkill(id){
  if(!confirm('确认删除？'))return;
  await api(`/skills/${id}`,{method:'DELETE'});toast('已删除');loadSkills();
}

// ===== Init =====
initNav();
onHashChange();
</script>
